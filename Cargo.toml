[package]
name = "rustxng"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
description = "SearXNG を Rust で書き直したメタ検索エンジン (AGPL-3.0-or-later)"
repository = "https://github.com/sahenjp/rustxng"
readme = "README.md"
keywords = ["searxng", "metasearch", "search-engine", "privacy"]
categories = ["web-programming::http-server"]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "deflate", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serde_yaml = "0.9"
askama = "0.12"
scraper = "0.20"
url = "2"
percent-encoding = "2"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["trace"] }
quick-xml = { version = "0.36", features = ["serialize"] }
thiserror = "2"
regex = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
postgres = { version = "0.19", optional = true }
mysql = { version = "26", default-features = false, features = ["minimal"], optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
mongodb = { version = "3", default-features = false, features = ["bson-3", "compat-3-3-0", "rustls-tls"], optional = true }
bson = { version = "3", optional = true }

[features]
default = ["db-engines"]
# Database backed engines (postgresql, mysql, mariadb, sqlite, mongodb).
# Disable with --no-default-features for a smaller binary.
db-engines = ["dep:postgres", "dep:mysql", "dep:rusqlite", "dep:mongodb", "dep:bson"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
