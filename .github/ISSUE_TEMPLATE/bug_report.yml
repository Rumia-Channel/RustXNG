name: Bug report
description: 不具合の報告
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        再現手順と環境を具体的に書いてください。セキュリティ問題は Issue ではなく SECURITY.md の手順で報告してください。
  - type: input
    id: version
    attributes:
      label: バージョン / コミット
      description: リリースタグ、または `git rev-parse --short HEAD` の出力
      placeholder: v0.1.0 / a71ac6f
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 何が起きたか
      description: 実際の結果と、期待していた結果
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: クエリ文字列、設定、エンドポイント、実行コマンドなど
      placeholder: |
        1. cargo run --release -- --port 8888
        2. curl 'http://127.0.0.1:8888/search?q=...&format=json'
        3. ...
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: 関係するエンジン
      description: 分かる場合のみ（例: wikipedia, duckduckgo）
  - type: textarea
    id: env
    attributes:
      label: 環境
      description: OS / Rust のバージョン / CPU アーキテクチャ
      placeholder: Linux x86_64, Rust 1.99.1
  - type: textarea
    id: logs
    attributes:
      label: ログ・レスポンス
      description: `RUST_LOG=debug` の出力や JSON レスポンス（秘密情報は除く）
      render: text
